name: PR CI

# Tests y build en todas las PRs, sin filtrar por ficheros
on:
  pull_request:

# Una ejecución nueva de la misma PR cancela la anterior
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint || true

      - name: Run tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

  automerge-dependabot:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auto-merge Dependabot when checks pass
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number });
            const checks = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: pr.data.head.sha });
            const allSuccess = checks.data.check_runs.every(c => c.conclusion === 'success' || c.conclusion === null);
            if (allSuccess) {
              await github.rest.pulls.merge({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, merge_method: 'squash' });
            } else {
              core.info('Not all checks passed yet; skipping auto-merge.');
            }
